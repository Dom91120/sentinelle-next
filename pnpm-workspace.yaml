# Réglages pnpm (depuis pnpm 11, ils vivent ici et non plus dans package.json).
# Autorise l'exécution des scripts de build de ces dépendances (bloqués par défaut).
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true

# Exception au délai minimal de publication de pnpm : cette version corrige les avis
# de sécurité (nodemailer, linkify-it) remontés par l'audit, on ne l'attend pas.
minimumReleaseAgeExclude:
  - mailparser@3.10.0

# Versions minimales forcées sur des dépendances TRANSITIVES portant un avis de
# sécurité (reprises de culturesa-next, même socle, mêmes raisons).
overrides:
  'postcss@<8.5.18': '>=8.5.18 <9'
  'fast-uri@<3.1.6': '>=3.1.6 <4'
  'mysql2@<3.23.1': '>=3.23.1 <4'
  'sharp@<0.35.5': '>=0.35.5 <0.36'
  'source-map-js@<1.2.2': '>=1.2.2 <2'
